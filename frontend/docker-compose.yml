services:
  # Development container with volume mount and web server
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: aura-frontend-dev
    ports:
      - "${FRONTEND_DEV_PORT:-8080}:8080"
    volumes:
      - .:/app
      - /app/build
      - /app/.dart_tool
    environment:
      - CHOKIDAR_USEPOLLING=true

  # Production multi-stage container served by Nginx
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FLAVOR: ${FLAVOR:-admin}
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8000/api}
        USE_MOCK_DATA: ${USE_MOCK_DATA:-true}
        POWER_BI_EMBED_URL: ${POWER_BI_EMBED_URL:-}
        AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-}
    container_name: aura-frontend-prod
    ports:
      - "${FRONTEND_PROD_PORT:-80}:80"