version: '3.8'

services:
  # Development environment - Uses local volume mount and hot reload
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/build
      - /app/.dart_tool
    environment:
      - CHOKIDAR_USEPOLLING=true # Helps with file watching in some OS/Docker combos
    # Uncomment to connect to your backend network
    # networks:
    #   - erp-network

  # Production environment - Multi-stage build served by Nginx
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - FLAVOR=admin
        - API_BASE_URL=http://api-gateway:8000/api
    ports:
      - "80:80"
    # networks:
    #   - erp-network

# networks:
#   erp-network:
#     external: true