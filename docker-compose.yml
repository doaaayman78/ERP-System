services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp}
      POSTGRES_USER: ${POSTGRES_USER:-erp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development Flutter Web server with volume mount
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: aura-frontend-dev
    ports:
      - "${FRONTEND_DEV_PORT:-8080}:8080"
    volumes:
      - ./frontend:/app
      - /app/build
      - /app/.dart_tool
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp-network

  # Production multi-stage Flutter Web build served by Nginx
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FLAVOR: ${FLAVOR:-admin}
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8000/api}
        USE_MOCK_DATA: ${USE_MOCK_DATA:-true}
        POWER_BI_EMBED_URL: ${POWER_BI_EMBED_URL:-}
        AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-}
    container_name: aura-frontend-prod
    ports:
      - "${FRONTEND_PROD_PORT:-80}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp-network

volumes:
  erp_postgres_data:

networks:
  erp-network:
    driver: bridge